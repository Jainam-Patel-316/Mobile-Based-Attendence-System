<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Portal - Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        .master-top-bar {
            height: 64px;
            background-color: #002060; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 50;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .master-container {
            display: flex;
            min-height: 100vh;
            padding-top: 64px; 
            background-color: #f8fafc; 
        }

        .master-sidebar {
            width: 260px;
            background-color: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            top: 64px;
            left: 0;
            bottom: 0;
            z-index: 40;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .master-main-content {
            flex: 1;
            margin-left: 260px; 
            padding: 40px 24px 100px 24px; 
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-width: 0;
        }

        .content-canvas-box {
            width: 100%;
            max-width: 1024px;
        }

        @media (max-width: 768px) {
            .master-sidebar {
                transform: translateX(-100%); 
                top: 64px;
                height: calc(100vh - 64px);
            }
            .master-sidebar.open {
                transform: translateX(0);
            }
            .master-main-content {
                margin-left: 0; 
                padding: 24px 16px;
            }
        }
    </style>
</head>
<body>

    <header class="master-top-bar">
        <div class="flex items-center gap-4">
            <button id="menuBtn" class="md:hidden flex flex-col justify-between w-6 h-4.5 cursor-pointer">
                <span class="h-0.5 w-full bg-white rounded-sm"></span>
                <span class="h-0.5 w-full bg-white rounded-sm"></span>
                <span class="h-0.5 w-full bg-white rounded-sm"></span>
            </button>
            <div class="text-white font-bold tracking-wide text-base">manage</div>
        </div>
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full border-2 border-white/80 bg-slate-300/20 cursor-pointer hover:scale-105 transition" id="profileBtn" title="Go to Login"></div>
        </div>
    </header>

    <div class="master-container">

        <aside class="master-sidebar" id="sidebar">
            <nav class="flex flex-col w-full" id="sidebarMenuContainer">
                <button onclick="window.location.href='home.html'" class="w-full text-left px-6 py-4 font-bold text-slate-600 hover:bg-slate-50 hover:text-[#002060] border-b border-slate-100 transition cursor-pointer">HOME HUB</button>
                <button class="w-full text-left px-6 py-4 font-bold bg-slate-50 text-[#002060] border-l-4 border-[#002060] border-b border-slate-100 transition">ADMIN DESK</button>
            </nav>
            <button id="logoutBtn" class="w-full text-left px-6 py-4 font-bold text-rose-600 hover:bg-rose-50 border-t border-slate-100 transition cursor-pointer">Logout Session &rarr;</button>
        </aside>

        <div id="overlay" class="fixed inset-0 bg-slate-900/30 z-30 hidden md:hidden"></div>

        <main class="master-main-content">
            <div class="content-canvas-box space-y-8">

                <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex gap-4">
                    <button onclick="switchAdminTab('student')" id="tabBtnStudent" class="px-5 py-2 rounded-lg text-xs font-bold transition cursor-pointer bg-[#002060] text-white">
                        Manage Students
                    </button>
                    <button onclick="switchAdminTab('faculty')" id="tabBtnFaculty" class="px-5 py-2 rounded-lg text-xs font-bold transition cursor-pointer bg-slate-100 text-slate-600 hover:bg-slate-200">
                        Manage Faculty
                    </button>
                </div>

                <div id="adminStudentPanel" class="space-y-4">
                    <h2 class="text-lg font-bold text-slate-800 tracking-tight">Student Directory</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" id="studentCardsContainer"></div>
                </div>

                <div id="adminFacultyPanel" class="hidden space-y-4">
                    <h2 class="text-lg font-bold text-slate-800 tracking-tight">Faculty Directory</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" id="facultyCardsContainer"></div>
                </div>

                <div id="editDataModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
                    <div class="bg-white rounded-xl border border-slate-200 shadow-xl w-full max-w-md overflow-hidden">
                        <div class="bg-[#002060] p-4 text-white font-bold text-sm flex justify-between items-center">
                            <span>Modify Database Entity Record</span>
                            <button onclick="closeEditModal()" class="text-white/70 hover:text-white text-xl font-mono cursor-pointer">&times;</button>
                        </div>
                        <form id="modalEditForm" onsubmit="saveDatabaseEdits(event)" class="p-6 space-y-4">
                            <div id="modalFormFieldsContainer" class="space-y-3"></div>
                            
                            <div class="flex justify-end gap-3 pt-2">
                                <button type="button" onclick="closeEditModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-4 py-2 rounded-lg transition cursor-pointer">
                                    Cancel
                                </button>
                                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-5 py-2 rounded-lg transition shadow-xs cursor-pointer">
                                    Commit Edits
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const profileBtn = document.getElementById('profileBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        const adminStudentPanel = document.getElementById('adminStudentPanel');
        const adminFacultyPanel = document.getElementById('adminFacultyPanel');
        const studentCardsContainer = document.getElementById('studentCardsContainer');
        const facultyCardsContainer = document.getElementById('facultyCardsContainer');
        
        const editDataModal = document.getElementById('editDataModal');
        const modalFormFieldsContainer = document.getElementById('modalFormFieldsContainer');
        
        let activeEditType = ''; 
        let activeEditId = null;

        menuBtn.addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.remove('hidden'); });
        function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.add('hidden'); }
        overlay.addEventListener('click', closeSidebar);
        profileBtn.addEventListener('click', () => { window.location.href = 'login.html'; });

        let databaseStudents = [
            { id: 1, name: "John Doe", enrollment: "ENR3060824001", semester: "Semester 4", hosteler: true },
            { id: 2, name: "Jane Smith", enrollment: "ENR3060824002", semester: "Semester 2", hosteler: false }
        ];

        let databaseFaculty = [
            { id: 1, username: "dr_amit_sharma", name: "Dr. Amit Sharma", department: "Computer Science" },
            { id: 2, username: "prof_v_narayan", name: "Prof. V. Narayan", department: "Information Technology" }
        ];

        function renderStudentCards() {
            studentCardsContainer.innerHTML = databaseStudents.map(student => `
                <div onclick="openStudentEditor(${student.id})" class="bg-white p-6 rounded-xl border border-slate-200 shadow-xs hover:border-[#002060] cursor-pointer transition flex flex-col justify-between">
                    <div>
                        <h3 class="font-bold text-base text-slate-800 leading-tight">${student.name}</h3>
                        <p class="text-xs font-mono font-bold text-slate-400 mt-1">${student.enrollment}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-xs">
                        <span class="font-medium text-slate-600">${student.semester}</span>
                        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${student.hosteler ? 'bg-indigo-50 text-indigo-700 border border-indigo-200' : 'bg-amber-50 text-amber-700 border border-amber-200'}">
                            ${student.hosteler ? 'Hosteler' : 'Day Scholar'}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        function renderFacultyCards() {
            facultyCardsContainer.innerHTML = databaseFaculty.map(faculty => `
                <div onclick="openFacultyEditor(${faculty.id})" class="bg-white p-6 rounded-xl border border-slate-200 shadow-xs hover:border-[#002060] cursor-pointer transition flex flex-col justify-between">
                    <div>
                        <span class="text-[10px] font-mono font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded border border-slate-200">@${faculty.username}</span>
                        <h3 class="font-bold text-base text-slate-800 mt-2.5 leading-tight">${faculty.name}</h3>
                        <p class="text-xs text-slate-400 mt-0.5">${faculty.department}</p>
                    </div>
                    <div class="mt-4 pt-2 text-right text-[11px] font-bold text-[#002060]">
                        Click to edit database details &rarr;
                    </div>
                </div>
            `).join('');
        }

        function switchAdminTab(targetView) {
            const btnStudent = document.getElementById('tabBtnStudent');
            const btnFaculty = document.getElementById('tabBtnFaculty');

            if (targetView === 'student') {
                adminStudentPanel.classList.remove('hidden');
                adminFacultyPanel.classList.add('hidden');
                btnStudent.className = "px-5 py-2 rounded-lg text-xs font-bold transition cursor-pointer bg-[#002060] text-white";
                btnFaculty.className = "px-5 py-2 rounded-lg text-xs font-bold transition cursor-pointer bg-slate-100 text-slate-600 hover:bg-slate-200";
            } else {
                adminStudentPanel.classList.add('hidden');
                adminFacultyPanel.classList.remove('hidden');
                btnStudent.className = "px-5 py-2 rounded-lg text-xs font-bold transition cursor-pointer bg-slate-100 text-slate-600 hover:bg-slate-200";
                btnFaculty.className = "px-5 py-2 rounded-lg text-xs font-bold transition cursor-pointer bg-[#002060] text-white";
            }
        }

        function openStudentEditor(id) {
            activeEditType = 'student';
            activeEditId = id;
            const target = databaseStudents.find(s => s.id === id);

            modalFormFieldsContainer.innerHTML = `
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-slate-500 uppercase">Student Full Name</label>
                    <input type="text" id="editField_name" value="${target.name}" class="w-full text-sm border border-slate-200 rounded-lg p-2.5 focus:outline-[#002060]" required>
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-slate-500 uppercase">Enrollment ID Number</label>
                    <input type="text" id="editField_enrollment" value="${target.enrollment}" class="w-full text-sm font-mono border border-slate-200 rounded-lg p-2.5 focus:outline-[#002060]" required>
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-slate-500 uppercase">Current Term / Semester</label>
                    <input type="text" id="editField_semester" value="${target.semester}" class="w-full text-sm border border-slate-200 rounded-lg p-2.5 focus:outline-[#002060]" required>
                </div>
                <div class="flex items-center gap-2 pt-2">
                    <input type="checkbox" id="editField_hosteler" ${target.hosteler ? 'checked' : ''} class="w-4 h-4 accent-[#002060] cursor-pointer">
                    <label for="editField_hosteler" class="text-xs font-semibold text-slate-700 cursor-pointer">Verified Hosteler Status</label>
                </div>
            `;
            editDataModal.classList.remove('hidden');
        }

        function openFacultyEditor(id) {
            activeEditType = 'faculty';
            activeEditId = id;
            const target = databaseFaculty.find(f => f.id === id);

            modalFormFieldsContainer.innerHTML = `
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-slate-500 uppercase">Account Username Handle</label>
                    <input type="text" id="editField_username" value="${target.username}" class="w-full text-sm font-mono border border-slate-200 rounded-lg p-2.5 focus:outline-[#002060]" required>
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-slate-500 uppercase">Faculty Member Name</label>
                    <input type="text" id="editField_name" value="${target.name}" class="w-full text-sm border border-slate-200 rounded-lg p-2.5 focus:outline-[#002060]" required>
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-slate-500 uppercase">Department / Center Placement</label>
                    <input type="text" id="editField_department" value="${target.department}" class="w-full text-sm border border-slate-200 rounded-lg p-2.5 focus:outline-[#002060]" required>
                </div>
            `;
            editDataModal.classList.remove('hidden');
        }

        function closeEditModal() {
            editDataModal.classList.add('hidden');
            modalFormFieldsContainer.innerHTML = '';
        }

        function saveDatabaseEdits(event) {
            event.preventDefault();

            if (activeEditType === 'student') {
                const target = databaseStudents.find(s => s.id === activeEditId);
                if (target) {
                    target.name = document.getElementById('editField_name').value;
                    target.enrollment = document.getElementById('editField_enrollment').value;
                    target.semester = document.getElementById('editField_semester').value;
                    target.hosteler = document.getElementById('editField_hosteler').checked;
                }
                renderStudentCards();
            } else if (activeEditType === 'faculty') {
                const target = databaseFaculty.find(f => f.id === activeEditId);
                if (target) {
                    target.username = document.getElementById('editField_username').value;
                    target.name = document.getElementById('editField_name').value;
                    target.department = document.getElementById('editField_department').value;
                }
                renderFacultyCards();
            }

            closeEditModal();
        }

        function checkAdminEnvironment() {
            const flag = sessionStorage.getItem('flag') || 'admin login'; 
            sessionStorage.setItem('flag', flag);

            renderStudentCards();
            renderFacultyCards();
        }

        logoutBtn.addEventListener('click', () => {
            sessionStorage.clear();
            window.location.href = 'login.html';
        });

        checkAdminEnvironment();
    </script>
</body>
</html>
