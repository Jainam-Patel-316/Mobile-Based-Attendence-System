<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Navy & White Home Page</title>
    
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
        }

        
        .top-bar {
            height: 60px;
            background-color: #002060; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        
        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 25px;
            height: 18px;
        }

        
        .menu-btn span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #ffffff; 
            border-radius: 2px;
        }

        
        .profile-icon {
            width: 32px;
            height: 32px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            background-color: transparent;
        }

        
        .sidebar {
            position: fixed;
            top: 0;
            left: -260px; 
            width: 260px;
            height: 100%;
            background-color: #ffffff;
            border-right: 2px solid #002060; 
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-top: 60px;
            transition: left 0.3s ease;
        }

        
        .sidebar.open {
            left: 0;
        }

    
        .sidebar-item {
            background: none;
            border: none;
            text-align: left;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            color: #002060; 
            cursor: pointer;
            width: 100%;
            border-bottom: 1px solid #eeeeee;
        }

        
        .sidebar-item.active {
            background-color: #002060;
            color: #ffffff; 
        }

        
        .logout-btn {
            border-top: 1px solid #eeeeee;
            border-bottom: none;
        }

        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 32, 96, 0.2); 
            z-index: 150;
            display: none;
        }

        .overlay.show {
            display: block;
        }

        
        .main-content {
            margin-top: 100px;
            text-align: center;
            padding: 20px;
        }
        
        .main-content h1 {
            color: #002060;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <button class="menu-btn" id="menuBtn">
            <span></span>
            <span></span>
            <span></span>
        </button>
        
        <div class="profile-icon" id="profileBtn"></div>
    </header>

    <div class="sidebar" id="sidebar">
        <div>
            <button class="sidebar-item active" id="homeBtn">HOME</button>
        </div>
        <button class="sidebar-item logout-btn" id="logoutBtn">Logout &rarr;</button>
    </div>

    <div class="overlay" id="overlay"></div>

    <main class="main-content">
        <h1>HOME PAGE</h1>
        <p></p>
    </main>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const profileBtn = document.getElementById('profileBtn');
        const homeBtn = document.getElementById('homeBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        
        menuBtn.addEventListener('click', () => {
            sidebar.classList.add('open');
            overlay.classList.add('show');
        });

        
        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        }

        
        overlay.addEventListener('click', closeSidebar);

        
        profileBtn.addEventListener('click', () => {
            window.location.href = 'login.html'; 
        });

        
        homeBtn.addEventListener('click', closeSidebar);

    
        logoutBtn.addEventListener('click', () => {
            
            sessionStorage.clear();
            localStorage.clear();

            
            const cookies = document.cookie.split(";");
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i];
                const eqPos = cookie.indexOf("=");
                const name = eqPos > -1 ? cookie.substr(0, eqPos).trim() : cookie.trim();
                document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/";
            }

            
            alert("Logging out... Sessions and cookies cleared.");
            
            
            window.location.reload();
        });
    </script>
</body>
</html>
