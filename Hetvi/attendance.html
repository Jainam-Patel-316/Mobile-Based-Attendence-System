<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Portal - Unified Attendance Matrix</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        .master-top-bar {
            height: 64px;
            background-color: #002060; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 50;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .master-container {
            display: flex;
            min-height: 100vh;
            padding-top: 64px; 
            background-color: #f8fafc; 
        }

        .master-sidebar {
            width: 260px;
            background-color: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            top: 64px;
            left: 0;
            bottom: 0;
            z-index: 40;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .master-main-content {
            flex: 1;
            margin-left: 260px; 
            padding: 40px 24px 100px 24px; 
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-width: 0;
        }

        .content-canvas-box {
            width: 100%;
            max-width: 1024px;
        }

        @media (max-width: 768px) {
            .master-sidebar {
                transform: translateX(-100%); 
                top: 64px;
                height: calc(100vh - 64px);
            }
            .master-sidebar.open {
                transform: translateX(0);
            }
            .master-main-content {
                margin-left: 0; 
                padding: 24px 16px;
            }
        }
    </style>
</head>
<body>

    <header class="master-top-bar">
        <div class="flex items-center gap-4">
            <button id="menuBtn" class="md:hidden flex flex-col justify-between w-6 h-4.5 cursor-pointer">
                <span class="h-0.5 w-full bg-white rounded-sm"></span>
                <span class="h-0.5 w-full bg-white rounded-sm"></span>
                <span class="h-0.5 w-full bg-white rounded-sm"></span>
            </button>
            <div class="text-white font-bold tracking-wide text-base">attendance</div>
        </div>
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full border-2 border-white/80 bg-slate-300/20 cursor-pointer hover:scale-105 transition" id="profileBtn" title="Go to Login"></div>
        </div>
    </header>

    <div class="master-container">

        <aside class="master-sidebar" id="sidebar">
            <nav class="flex flex-col w-full" id="sidebarMenuContainer">
                <button onclick="window.location.href='home.html'" class="w-full text-left px-6 py-4 font-bold text-slate-600 hover:bg-slate-50 hover:text-[#002060] border-b border-slate-100 transition cursor-pointer">HOME </button>
                <button class="w-full text-left px-6 py-4 font-bold bg-slate-50 text-[#002060] border-l-4 border-[#002060] border-b border-slate-100 transition">ATTENDANCE</button>
            </nav>
            <button id="logoutBtn" class="w-full text-left px-6 py-4 font-bold text-rose-600 hover:bg-rose-50 border-t border-slate-100 transition cursor-pointer">Logout  &rarr;</button>
        </aside>

        <div id="overlay" class="fixed inset-0 bg-slate-900/30 z-30 hidden md:hidden"></div>

        <main class="master-main-content">
            <div class="content-canvas-box">

                <div id="studentViewPanel" class="hidden space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" id="studentCardsContainer">
                        </div>
                </div>

                <div id="facultyViewPanel" class="hidden space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" id="facultyCardsContainer">
                        </div>
                </div>

                <div id="attendanceSheetPanel" class="hidden space-y-6">
                    <div class="bg-white border border-slate-200 rounded-xl p-8 shadow-sm flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                        <div class="space-y-1">
                            <h2 id="activeSheetTitle" class="text-xl font-black text-slate-900 tracking-tight">Subject Name</h2>
                            <p id="activeSheetMeta" class="text-xs font-mono text-[#002060] font-bold uppercase tracking-wider">SEC-II • Active Register</p>
                        </div>
                        <button onclick="exitActiveRollSheet()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold px-4 py-2 rounded-lg transition max-w-max cursor-pointer">
                            &larr; Cancel Roll Sheet
                        </button>
                    </div>

                    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-50 border-b border-slate-200">
                                <tr>
                                    <th class="p-4 pl-6 text-xs font-bold uppercase text-slate-500 font-mono">University Roll Code</th>
                                    <th class="p-4 pr-6 text-xs font-bold uppercase text-slate-500 text-center w-36">Status Selection</th>
                                </tr>
                            </thead>
                            <tbody id="attendanceSheetTableBody" class="divide-y divide-slate-100 font-mono text-sm">
                                </tbody>
                        </table>
                        <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-end">
                            <button onclick="commitAttendanceEntry()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-6 py-2.5 rounded-lg shadow-sm transition cursor-pointer">
                                Save Session Summary
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const profileBtn = document.getElementById('profileBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        const studentViewPanel = document.getElementById('studentViewPanel');
        const facultyViewPanel = document.getElementById('facultyViewPanel');
        const attendanceSheetPanel = document.getElementById('attendanceSheetPanel');
        
        const studentCardsContainer = document.getElementById('studentCardsContainer');
        const facultyCardsContainer = document.getElementById('facultyCardsContainer');
        const attendanceSheetTableBody = document.getElementById('attendanceSheetTableBody');

        menuBtn.addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.remove('hidden'); });
        function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.add('hidden'); }
        overlay.addEventListener('click', closeSidebar);
        profileBtn.addEventListener('click', () => { window.location.href = 'login.html'; });

        //  DATABASE DATA 
        const mockDbStudentSubjects = [
            { id: 101, section: "SEC-II", name: "Intro to Web Scripting", category: "Theory Lectures", logged: "18 of 22 Sessions", percentage: "82%" },
            { id: 102, section: "SEC-I", name: "Database Management Systems", category: "Practical Labs", logged: "10 of 12 Sessions", percentage: "83%" }
        ];

        const mockDbFacultyClasses = [
            { id: 201, section: "SEC-II", name: "Intro to Web Scripting - sem 4" },
            { id: 202, section: "SEC-I", name: "Advanced Java Systems - sem 6" }
        ];

        const mockDbStudentsRoster = [
            { rollCode: "3060824001", present: true },
            { rollCode: "3060824002", present: true },
            { rollCode: "3060824003", present: false }
        ];

        
        function loadStudentDatabaseData(data) {
            studentCardsContainer.innerHTML = data.map(item => `
                <div class="bg-white p-6 rounded-xl border border-slate-200 flex flex-col justify-between shadow-xs">
                    <div class="mb-5">
                        <span class="text-[10px] font-bold text-[#002060] bg-slate-50 px-2 py-0.5 rounded font-mono border border-slate-200/60">${item.section}</span>
                        <h3 class="font-bold text-sm text-slate-800 mt-2.5 leading-snug">${item.name}</h3>
                    </div>
                    <div class="space-y-3 mt-1">
                        <div class="p-4 bg-slate-50/70 border border-slate-100 rounded-lg flex items-center justify-between">
                            <div>
                                <p class="text-[9px] uppercase font-bold text-slate-400 tracking-wider">${item.category}</p>
                                <p class="text-xs font-mono font-medium text-slate-500 mt-0.5">${item.logged}</p>
                            </div>
                            <div class="text-right"><span class="text-lg font-black text-emerald-600">${item.percentage}</span></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function loadFacultyDatabaseData(data) {
            facultyCardsContainer.innerHTML = data.map(item => `
                <div class="bg-white p-6 rounded-xl border border-slate-200 flex flex-col justify-between shadow-xs">
                    <div class="mb-5">
                        <span class="text-[10px] font-bold text-[#002060] bg-slate-50 px-2 py-0.5 rounded font-mono border border-slate-200/60">${item.section}</span>
                        <h3 class="font-bold text-sm text-slate-800 mt-2.5 leading-snug">${item.name}</h3>
                    </div>
                    <button onclick="launchRollCallSheet('${item.name}', '${item.section}')" class="w-full bg-[#002060] hover:bg-[#001845] text-white text-xs font-semibold py-2.5 rounded-lg transition text-center cursor-pointer">
                        Launch Roll Call Register
                    </button>
                </div>
            `).join('');
        }

        function loadActiveRosterDatabaseData(data) {
            attendanceSheetTableBody.innerHTML = data.map(student => `
                <tr class="hover:bg-slate-50/80 transition-colors">
                    <td class="p-4 pl-6 font-semibold text-slate-700">${student.rollCode}</td>
                    <td class="p-4 pr-6 text-center">
                        <input type="checkbox" data-roll="${student.rollCode}" ${student.present ? 'checked' : ''} class="w-4 h-4 accent-[#002060] cursor-pointer">
                    </td>
                </tr>
            `).join('');
        }

        function runFlagSwitchboardCheck() {
            const sessionFlagToken = sessionStorage.getItem('flag');

            studentViewPanel.classList.add('hidden');
            facultyViewPanel.classList.add('hidden');
            attendanceSheetPanel.classList.add('hidden');

            if (sessionFlagToken === 'student login' || sessionFlagToken === 'parent login') {
                loadStudentDatabaseData(mockDbStudentSubjects);
                studentViewPanel.classList.remove('hidden');
            } 
            else if (sessionFlagToken === 'faculty login' || sessionFlagToken === 'admin login') {
                loadFacultyDatabaseData(mockDbFacultyClasses);
                facultyViewPanel.classList.remove('hidden');
            } 
            else {
            
                loadStudentDatabaseData(mockDbStudentSubjects);
                loadFacultyDatabaseData(mockDbFacultyClasses);
                studentViewPanel.classList.remove('hidden');
                facultyViewPanel.classList.remove('hidden');
            }
        }

        function launchRollCallSheet(subjectName, sectionName) {
            document.getElementById('activeSheetTitle').innerText = subjectName;
            document.getElementById('activeSheetMeta').innerText = `${sectionName} • Active Register`;
            
            loadActiveRosterDatabaseData(mockDbStudentsRoster); 
            
            facultyViewPanel.classList.add('hidden');
            attendanceSheetPanel.classList.remove('hidden');
        }

        function exitActiveRollSheet() {
            attendanceSheetPanel.classList.add('hidden');
            facultyViewPanel.classList.remove('hidden');
        }

        function commitAttendanceEntry() {
            // database
            const checkboxes = attendanceSheetTableBody.querySelectorAll('input[type="checkbox"]');
            const savedData = Array.from(checkboxes).map(box => ({
                rollCode: box.getAttribute('data-roll'),
                present: box.checked
            }));
            
            console.log("Payload compiled for database save entry:", savedData);
            alert("Attendance logs synchronized successfully!");
            exitActiveRollSheet();
        }

        logoutBtn.addEventListener('click', () => {
            sessionStorage.clear();
            window.location.href = 'login.html';
        });

        runFlagSwitchboardCheck();
    </script>
</body>
</html>
