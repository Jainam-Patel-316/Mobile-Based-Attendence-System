<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAIT — QR Gate Scanner</title>

    <!-- html5-qrcode: opens camera and reads QR codes -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <!-- FingerprintJS: generates a unique device fingerprint hash -->
    <script>
        // Load FingerprintJS from CDN (free tier, no API key needed for basic visitorId)
        const fpPromise = import('https://openfpcdn.io/fingerprintjs/v4')
            .then(FingerprintJS => FingerprintJS.load());
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }

        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Top bar ── */
        .top-bar {
            height: 60px;
            background-color: #002060;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: fixed;
            top: 0; left: 0; width: 100%;
            z-index: 100;
        }
        .top-bar-title { color: #fff; font-weight: bold; font-size: 16px; }
        .back-btn {
            background: none; border: 1px solid rgba(255,255,255,0.5);
            color: #fff; padding: 6px 14px; border-radius: 20px;
            cursor: pointer; font-size: 13px; font-weight: bold;
        }
        .back-btn:hover { background: rgba(255,255,255,0.1); }

        /* ── Main layout ── */
        .main {
            margin-top: 60px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 40px;
            gap: 20px;
        }

        /* ── Session badge ── */
        .session-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #002060;
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.05em;
        }
        .session-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* ── Scanner box ── */
        .scanner-card {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border: 2px solid #002060;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,32,96,0.12);
        }

        .scanner-card-header {
            background: #002060;
            color: #fff;
            padding: 14px 20px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 0.05em;
        }

        /* html5-qrcode renders the camera feed inside this div */
        #qr-reader {
            width: 100%;
        }

        /* ── Status panel ── */
        .status-panel {
            width: 100%;
            max-width: 380px;
            border-radius: 12px;
            padding: 20px 24px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            display: none;
            border: 2px solid;
        }
        .status-panel.show { display: block; }
        .status-panel.success {
            background: #f0fdf4;
            border-color: #16a34a;
            color: #15803d;
        }
        .status-panel.error {
            background: #fff1f2;
            border-color: #dc2626;
            color: #b91c1c;
        }
        .status-panel.info {
            background: #eff6ff;
            border-color: #2563eb;
            color: #1d4ed8;
        }

        .status-icon { font-size: 36px; margin-bottom: 8px; }
        .status-title { font-size: 18px; font-weight: 900; margin-bottom: 4px; }
        .status-sub { font-size: 12px; font-weight: normal; margin-top: 6px; opacity: 0.8; }

        /* ── Instruction text ── */
        .instructions {
            font-size: 13px;
            color: #64748b;
            text-align: center;
            max-width: 320px;
            line-height: 1.6;
        }

        /* ── Scan again button ── */
        .scan-again-btn {
            background: #002060;
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: none;
        }
        .scan-again-btn.show { display: block; }
        .scan-again-btn:hover { background: #001845; }

        /* ── Device register hint ── */
        .register-hint {
            width: 100%;
            max-width: 380px;
            background: #fefce8;
            border: 1px solid #eab308;
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 12px;
            color: #854d0e;
            display: none;
        }
        .register-hint.show { display: block; }
        .register-hint strong { display: block; margin-bottom: 4px; font-size: 13px; }
        .register-device-btn {
            margin-top: 10px;
            background: #eab308;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
        }
        .register-device-btn:hover { background: #ca8a04; }
        .register-device-btn:disabled { background: #d1d5db; cursor: not-allowed; }
    </style>
</head>
<body>

    <header class="top-bar">
        <span class="top-bar-title">📷 QR Gate Scanner</span>
        <button class="back-btn" onclick="window.location.href='home.html'">← Home</button>
    </header>

    <main class="main">

        <!-- Live session indicator -->
        <div class="session-badge" id="sessionBadge">
            <span class="session-dot"></span>
            <span id="sessionBadgeText">Checking session...</span>
        </div>

        <!-- Camera / QR scanner box -->
        <div class="scanner-card" id="scannerCard">
            <div class="scanner-card-header">Point camera at the QR code on the gate</div>
            <div id="qr-reader"></div>
        </div>

        <p class="instructions">
            Make sure you are <strong>at College</strong> before scanning.
            Hold your phone steady — the scanner opens automatically.
        </p>

        <!-- Result panel (hidden until scan) -->
        <div class="status-panel" id="statusPanel">
            <div class="status-icon" id="statusIcon"></div>
            <div class="status-title" id="statusTitle"></div>
            <div id="statusBody"></div>
            <div class="status-sub" id="statusSub"></div>
        </div>

        <!-- Scan again button -->
        <button class="scan-again-btn" id="scanAgainBtn" onclick="restartScanner()">
            Scan Again
        </button>

    </main>

    <script>
        // ─────────────────────────────────────────────
        // KIOSK PAGE — no login required.
        // The device fingerprint itself is the identity;
        // it's matched server-side against approved devices.
        // ─────────────────────────────────────────────

        // ─────────────────────────────────────────────
        // GLOBALS
        // ─────────────────────────────────────────────
        let html5QrCode = null;
        let scanProcessed = false;   // prevent firing twice on same scan
        let currentFingerprint = null;

        // ─────────────────────────────────────────────
        // SESSION BADGE — what time window is active?
        // ─────────────────────────────────────────────
        function updateSessionBadge() {
            const now = new Date();
            const h = now.getHours();
            const m = now.getMinutes();
            const total = h * 60 + m;

            // Morning: 8:30–9:35  (adding 5 min grace)
            // Afternoon: 13:30–14:05
            const badgeEl = document.getElementById('sessionBadgeText');

            if (total >= 510 && total <= 575) {          // 8:30 – 9:35
                badgeEl.textContent = 'Morning Session — Gate OPEN';
            } else if (total >= 810 && total <= 845) {   // 13:30 – 14:05
                badgeEl.textContent = 'Afternoon Session — Gate OPEN';
            } else {
                badgeEl.textContent = 'Outside Scan Window';
                document.getElementById('sessionBadge').style.background = '#94a3b8';
                document.getElementById('sessionBadge').querySelector('.session-dot').style.background = '#f87171';
            }
        }
        updateSessionBadge();

        // ─────────────────────────────────────────────
        // GET DEVICE FINGERPRINT
        // fpPromise is set in <head> via the CDN import
        // ─────────────────────────────────────────────
        async function getDeviceFingerprint() {
            try {
                const fp = await fpPromise;
                const result = await fp.get();
                return result.visitorId;   // stable string like "abc123def456..."
            } catch (err) {
                console.error('FingerprintJS error:', err);
                return null;
            }
        }

        // ─────────────────────────────────────────────
        // GET DEVICE GPS LOCATION
        // Returns { lat, lng } or null if denied/unavailable
        // Times out after 10 seconds so scan doesn't hang forever
        // ─────────────────────────────────────────────
        function getDeviceLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve(null);
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        resolve({
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude
                        });
                    },
                    (err) => {
                        // Permission denied, unavailable, or timeout — resolve null
                        // The server will decide whether to reject based on geo config
                        console.warn('Geolocation error:', err.message);
                        resolve(null);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,        // wait max 10s for a GPS fix
                        maximumAge: 30000      // accept a cached position up to 30s old
                    }
                );
            });
        }

        // ─────────────────────────────────────────────
        // SHOW RESULT
        // ─────────────────────────────────────────────
        function showStatus(type, icon, title, body, sub = '') {
            const panel = document.getElementById('statusPanel');
            panel.className = 'status-panel show ' + type;
            document.getElementById('statusIcon').textContent = icon;
            document.getElementById('statusTitle').textContent = title;
            document.getElementById('statusBody').textContent = body;
            document.getElementById('statusSub').textContent = sub;

            // Hide scanner card after result
            document.getElementById('scannerCard').style.display = 'none';
        }

        // ─────────────────────────────────────────────
        // AFTER QR SCANNED — validate with backend
        // ─────────────────────────────────────────────
        async function onQrCodeScanned(decodedText) {
            if (scanProcessed) return;
            scanProcessed = true;

            // Stop camera immediately
            if (html5QrCode) {
                await html5QrCode.stop().catch(() => {});
            }

            // The device_token (cached by home.html after admin approval) is what
            // actually identifies this device now. Fingerprint alone isn't reliable,
            // since two students with the same phone model can get the same hash.
            const deviceToken = localStorage.getItem('device_token');

            if (!deviceToken) {
                showStatus('error', '📵', 'Device Not Synced',
                    'This device has no approved token cached yet.',
                    'Open the app on this phone, log in, and wait for admin approval, then try again.');
                document.getElementById('scanAgainBtn').classList.add('show');
                return;
            }

            showStatus('info', '📍', 'Getting Location...', 'Checking your GPS location. Please wait.', 'This takes a few seconds');

            // Get fingerprint AND location in parallel — faster than sequential
            // (fingerprint is now sent only for the audit log, not identification)
            const [fingerprintHash, geoLocation] = await Promise.all([
                getDeviceFingerprint(),
                getDeviceLocation()
            ]);
            currentFingerprint = fingerprintHash;

            if (!geoLocation) {
                showStatus('info', '📡', 'Verifying...', 'Location access was denied.', 'Checking with server — scan may be rejected if geofencing is enabled.');
            } else {
                showStatus('info', '⏳', 'Verifying...', 'Checking your device and session window.', 'Please wait');
            }

            // POST to backend — include geo if we got it
            try {
                const response = await fetch('/api/entry/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceToken, fingerprintHash, geo: geoLocation })
                });
                const data = await response.json();
                const result = { ok: response.ok, status: response.status, data };

                if (result.ok) {
                    if (result.data.alreadyScanned) {
                        showStatus('info', '✅', 'Already Scanned',
                            `You already marked entry for the ${result.data.session} session today.`,
                            'No duplicate entry needed.');
                    } else {
                        const sessionLabel = result.data.session === 'morning' ? 'Morning' : 'Afternoon';
                        showStatus('success', '✅', 'Attendance Marked!',
                            `${sessionLabel} session entry recorded successfully.`,
                            `Time: ${new Date(result.data.scannedAt).toLocaleTimeString()}`);
                    }
                } else {
                    const reason = result.data.reason;

                    if (reason === 'rejected_device') {
                        showStatus('error', '📵', 'Device Not Registered For College Entry',
                            'This phone is not an approved device for any student.',
                            'Log in once on this phone to register it, then ask admin to approve it.');
                        document.getElementById('scanAgainBtn').classList.add('show');

                    } else if (reason === 'rejected_time') {
                        let msg = '';

                        if (result.data.windows) {
                            msg = result.data.windows.map(w =>
                            `${w.session}: ${w.window_start.substring(0,5)} - ${w.window_end.substring(0,5)}`
                         ).join(' | ');
                        }

                        showStatus(
                        'error',
                        '🕐',
                        'Gate Closed',
                        result.data.error,
                        msg
                        );

                    } else if (reason === 'rejected_ip') {
                        showStatus('error', '📶', 'Wrong Network',
                            'You are not connected to College WiFi.',
                            'Connect to the college network and try again.');
                        document.getElementById('scanAgainBtn').classList.add('show');

                    } else if (reason === 'rejected_geo') {
                        const dist = result.data.distanceMeters;
                        const allowed = result.data.allowedRadiusMeters;
                        showStatus('error', '📍', 'Outside College Area',
                            dist ? `You are ${dist}m away. Must be within ${allowed}m of college.` : result.data.error,
                            'Move closer to the college building and scan again.');
                        document.getElementById('scanAgainBtn').classList.add('show');

                    } else if (reason === 'geo_not_sent') {
                        showStatus('error', '📍', 'Location Required',
                            'Please allow location access in your browser and scan again.',
                            'Settings → Site permissions → Location → Allow');
                        document.getElementById('scanAgainBtn').classList.add('show');

                    } else {
                        showStatus('error', '❌', 'Scan Failed',
                            result.data.error || 'Unknown error.',
                            'Contact admin if this keeps happening.');
                        document.getElementById('scanAgainBtn').classList.add('show');
                    }
                }
            } catch (err) {
                console.error('Scan API error:', err);
                showStatus('error', '⚠️', 'Server Unreachable',
                    'Cannot connect to the attendance server.',
                    'Make sure you are at College and the server is running.');
                document.getElementById('scanAgainBtn').classList.add('show');
            }
        }

        // ─────────────────────────────────────────────
        // START QR SCANNER
        // ─────────────────────────────────────────────
        function startScanner() {
            scanProcessed = false;
            document.getElementById('scannerCard').style.display = 'block';
            document.getElementById('statusPanel').className = 'status-panel';
            document.getElementById('scanAgainBtn').classList.remove('show');

            html5QrCode = new Html5Qrcode('qr-reader');

            const config = {
                fps: 10,
                qrbox: { width: 230, height: 230 },
                aspectRatio: 1.0
            };

            html5QrCode.start(
                { facingMode: 'environment' },   // use rear camera
                config,
                onQrCodeScanned,
                (errorMessage) => { /* silent scan errors — normal while camera is panning */ }
            ).catch(err => {
                showStatus('error', '📷', 'Camera Error',
                    'Could not access camera. Please allow camera permission.',
                    err?.message || '');
            });
        }

        function restartScanner() {
            startScanner();
        }

        // Auto-start on page load
        startScanner();
    </script>
</body>
</html>
