<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAIT — Login Portal</title>

    <!-- FingerprintJS — used to auto-register device fingerprint after student login -->
    <script>
        const fpPromise = import('https://openfpcdn.io/fingerprintjs/v4')
            .then(FingerprintJS => FingerprintJS.load());
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }

        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            border: 2px solid #002060;
            border-radius: 6px;
            padding: 25px;
            background-color: #ffffff;
        }

        .login-card h2 {
            color: #002060;
            text-align: center;
            margin-bottom: 6px;
            font-size: 24px;
        }

        .college-name {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 0.04em;
        }

        .role-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .role-option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: #002060;
            cursor: pointer;
            font-size: 16px;
        }

        .role-option input {
            accent-color: #002060;
            width: 18px;
            height: 18px;
        }

        .input-group {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .input-group.active { display: flex; }

        label {
            color: #002060;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #002060;
            border-radius: 4px;
            outline: none;
            font-size: 15px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #002060;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            display: none;
            margin-top: 10px;
        }

        .submit-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        /* Status message below the button */
        .login-status {
            margin-top: 12px;
            font-size: 13px;
            text-align: center;
            font-weight: bold;
            min-height: 18px;
            display: none;
        }
        .login-status.error { color: #dc2626; display: block; }
        .login-status.info  { color: #2563eb; display: block; }
        .login-status.success { color: #16a34a; display: block; }

        /* Device registration notice (shown after student login) */
        .device-notice {
            margin-top: 14px;
            padding: 12px;
            background: #fefce8;
            border: 1px solid #eab308;
            border-radius: 6px;
            font-size: 12px;
            color: #854d0e;
            display: none;
        }
        .device-notice.show { display: block; }
        .device-notice strong { display: block; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Login</h2>
        <div class="college-name">CAIT — College of Agricultural Information Technology</div>

        <div class="role-grid">
            <label class="role-option"><input type="radio" name="role" value="student"> Student</label>
            <!-- <label class="role-option"><input type="radio" name="role" value="parent"> Parent</label> 
            <label class="role-option"><input type="radio" name="role" value="faculty"> Faculty</label> -->
            <label class="role-option"><input type="radio" name="role" value="admin"> Admin</label>
        </div>

        <!-- Parent -->
        <div class="input-group" id="parent-group">
            <label>Parent/Student Reference Number</label>
            <input type="number" id="parentInput"
                   oninput="if(this.value.length>10)this.value=this.value.slice(0,10);"
                   placeholder="Max 10 digits">
        </div>

        <!-- Student -->
        <div class="input-group" id="student-group">
            <label>Enrollment Number</label>
            <input type="number" id="studentEnroll" placeholder="e.g. 3060821045">
            <!-- <label>Password</label>
            <input type="password" id="studentPass" placeholder="•••"> -->
        </div>

        <!-- Faculty -->
        <div class="input-group" id="faculty-group">
            <label>Faculty Email / Username</label>
            <input type="text" id="facultyUser" placeholder="faculty@cait.edu.in">
            <label>Password</label>
            <input type="password" id="facultyPass" placeholder="Password">
        </div>

        <!-- Admin -->
        <div class="input-group" id="admin-group">
            <label>Admin Email</label>
            <input type="text" id="adminUser" placeholder="admin@cait.edu.in">
            <label>Password</label>
            <input type="password" id="adminPass" placeholder="Password">
        </div>

        <button class="submit-btn" id="loginSubmitBtn">LOG IN</button>

        <div class="login-status" id="loginStatus"></div>

        <div class="device-notice" id="deviceNotice">
            <strong>📱 Device Submitted for Approval</strong>
            Your device fingerprint has been sent to the admin.
            Once approved, you'll be able to scan the QR code at the gate.
        </div>
    </div>

    <script>
        // ─────────────────────────────────────────────
        // API HELPER  (shared across all pages)
        // ─────────────────────────────────────────────
        async function apiCall(method, endpoint, body = null) {
            const token = sessionStorage.getItem('token');
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    ...(token && { 'Authorization': 'Bearer ' + token })
                }
            };
            if (body) options.body = JSON.stringify(body);

            const response = await fetch('https://tyke-endorphin-triumph.ngrok-free.dev'+ endpoint, options);
            const data = await response.json();

            if (response.status === 401 || response.status === 403) {
                sessionStorage.clear();
                window.location.href = 'login.html';
                return;
            }
            return { ok: response.ok, status: response.status, data };
        }

        // ─────────────────────────────────────────────
        // GET FINGERPRINT
        // ─────────────────────────────────────────────
        async function getDeviceFingerprint() {
            try {
                const fp = await fpPromise;
                const result = await fp.get();
                return result.visitorId;
            } catch (err) {
                console.warn('FingerprintJS unavailable:', err);
                return null;
            }
        }

        // ─────────────────────────────────────────────
        // STATUS HELPER
        // ─────────────────────────────────────────────
        function setStatus(type, msg) {
            const el = document.getElementById('loginStatus');
            el.className = 'login-status ' + type;
            el.textContent = msg;
        }

        // ─────────────────────────────────────────────
        // ROLE RADIO BUTTONS
        // ─────────────────────────────────────────────
        const roles = document.querySelectorAll('input[name="role"]');
        const loginSubmitBtn = document.getElementById('loginSubmitBtn');

        roles.forEach(radio => {
            radio.addEventListener('change', (e) => {
                ['parent','student','faculty','admin'].forEach(r =>
                    document.getElementById(`${r}-group`).classList.remove('active')
                );
                document.getElementById(`${e.target.value}-group`).classList.add('active');
                loginSubmitBtn.style.display = 'block';
                document.getElementById('loginStatus').className = 'login-status';
                document.getElementById('deviceNotice').classList.remove('show');
            });
        });

        // ─────────────────────────────────────────────
        // LOGIN SUBMIT
        // ─────────────────────────────────────────────
        loginSubmitBtn.addEventListener('click', async () => {
            const selectedRole = document.querySelector('input[name="role"]:checked')?.value;
            if (!selectedRole) return;

            loginSubmitBtn.disabled = true;
            setStatus('info', 'Logging in...');

            // ── Parent flow (separate, no JWT for now) ──
            if (selectedRole === 'parent') {
                setStatus('error', 'Parent login backend coming soon.');
                loginSubmitBtn.disabled = false;
                return;
            }

            // ── Build credentials ──
            let email = '';
            let password = '';
			let enrollment_no = '';

            if (selectedRole === 'student') {
				enrollment_no =
				document.getElementById('studentEnroll').value.trim();
			}else if (selectedRole === 'faculty') {
                email    = document.getElementById('facultyUser').value.trim();
                password = document.getElementById('facultyPass').value;
            } else if (selectedRole === 'admin') {
                email    = document.getElementById('adminUser').value.trim();
                password = document.getElementById('adminPass').value;
            }

            if (
    selectedRole === 'student' &&
    !enrollment_no
) {
    setStatus('error', 'Enter enrollment number.');
    loginSubmitBtn.disabled = false;
    return;
}

if (
    selectedRole !== 'student' &&
    (!email || !password)
) {
    setStatus('error', 'Please fill in all fields.');
    loginSubmitBtn.disabled = false;
    return;
}

            // ── POST /api/auth/login ──
            try {
                const response = await fetch('https://tyke-endorphin-triumph.ngrok-free.dev/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password,enrollment_no })
                });

                const data = await response.json();

                if (!response.ok) {
                    setStatus('error', data.error || 'Login failed. Check credentials.');
                    loginSubmitBtn.disabled = false;
                    return;
                }

                // ── Save session ──
                sessionStorage.setItem('token', data.token);
                sessionStorage.setItem('flag', data.user.role + ' login');
                sessionStorage.setItem('fetched_user', JSON.stringify(data.user));

                // ── If student: collect + submit fingerprint automatically ──
                if (selectedRole === 'student') {
                    setStatus('info', 'Login successful! Registering your device...');

                    const fingerprintHash = await getDeviceFingerprint();

                    if (fingerprintHash) {
                        // Store locally so scanner.html can reuse it
                        sessionStorage.setItem('device_fingerprint', fingerprintHash);

                        // POST device for admin approval (backend will ignore if already exists)
                        try {
                            await apiCall('POST', '/api/devices/register', {
                                fingerprintHash,
                                deviceLabel: navigator.userAgent.substring(0, 80)
                            });
                            // Show device notice briefly, then redirect
                            document.getElementById('deviceNotice').classList.add('show');
                        } catch (e) {
                            console.warn('Device register call failed silently:', e);
                        }
                    }

                    setTimeout(() => { window.location.href = 'home.html'; }, 1200);

                } else {
                    // Faculty / admin go straight to home
                    window.location.href = 'home.html';
                }

            } catch (err) {
                console.error('Login fetch error:', err);
                setStatus('error', 'Cannot reach server. Is it running on port 5000?');
                loginSubmitBtn.disabled = false;
            }
        });

        // Allow Enter key to submit
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && loginSubmitBtn.style.display !== 'none') {
                loginSubmitBtn.click();
            }
        });
    </script>
</body>
</html>
