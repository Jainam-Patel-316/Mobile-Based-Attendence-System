<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Portal - Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        .master-top-bar {
            height: 64px; background-color: #002060;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; position: fixed; top: 0; left: 0; width: 100%; z-index: 50;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .master-container { display: flex; min-height: 100vh; padding-top: 64px; background-color: #f8fafc; }
        .master-sidebar {
            width: 260px; background-color: #ffffff; border-right: 1px solid #e2e8f0;
            display: flex; flex-direction: column; justify-content: space-between;
            position: fixed; top: 64px; left: 0; bottom: 0; z-index: 40;
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        .master-main-content {
            flex: 1; margin-left: 260px; padding: 40px 24px 100px 24px;
            display: flex; justify-content: center; align-items: flex-start; min-width: 0;
        }
        .content-canvas-box { width: 100%; max-width: 1024px; }
        @media (max-width:768px) {
            .master-sidebar { transform: translateX(-100%); top: 64px; height: calc(100vh - 64px); }
            .master-sidebar.open { transform: translateX(0); }
            .master-main-content { margin-left: 0; padding: 24px 16px; }
        }
    </style>
</head>
<body>

    <header class="master-top-bar">
        <div class="flex items-center gap-4">
            <button id="menuBtn" class="md:hidden flex flex-col justify-between w-6 h-4.5 cursor-pointer">
                <span class="h-0.5 w-full bg-white rounded-sm"></span>
                <span class="h-0.5 w-full bg-white rounded-sm"></span>
                <span class="h-0.5 w-full bg-white rounded-sm"></span>
            </button>
            <div class="text-white font-bold tracking-wide text-base">admin panel</div>
        </div>
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full border-2 border-white/80 bg-slate-300/20 cursor-pointer hover:scale-105 transition" id="profileBtn"></div>
        </div>
    </header>

    <div class="master-container">
        <aside class="master-sidebar" id="sidebar">
            <nav class="flex flex-col w-full">
                <button onclick="window.location.href='home.html'" class="w-full text-left px-6 py-4 font-bold text-slate-600 hover:bg-slate-50 hover:text-[#002060] border-b border-slate-100 transition cursor-pointer">HOME HUB</button>
                <button class="w-full text-left px-6 py-4 font-bold bg-slate-50 text-[#002060] border-l-4 border-[#002060] border-b border-slate-100 transition">ADMIN DESK</button>
            </nav>
            <button id="logoutBtn" class="w-full text-left px-6 py-4 font-bold text-rose-600 hover:bg-rose-50 border-t border-slate-100 transition cursor-pointer">Logout Session →</button>
        </aside>

        <div id="overlay" class="fixed inset-0 bg-slate-900/30 z-30 hidden md:hidden"></div>

        <main class="master-main-content">
            <div class="content-canvas-box space-y-8">

                <!-- ── TAB BAR ── -->
                <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex flex-wrap gap-3">
                    <button onclick="switchTab('students')" id="tabStudents" class="px-5 py-2 rounded-lg text-xs font-bold transition cursor-pointer bg-[#002060] text-white">Students</button>
                    <button onclick="switchTab('faculty')"  id="tabFaculty"  class="px-5 py-2 rounded-lg text-xs font-bold transition cursor-pointer bg-slate-100 text-slate-600 hover:bg-slate-200">Faculty</button>
                    <button onclick="switchTab('devices')"  id="tabDevices"  class="px-5 py-2 rounded-lg text-xs font-bold transition cursor-pointer bg-slate-100 text-slate-600 hover:bg-slate-200">
                        Pending Devices
                        <span id="pendingBadge" class="ml-1.5 bg-red-500 text-white text-[10px] rounded-full px-1.5 py-0.5 hidden">0</span>
                    </button>
                    <button onclick="switchTab('createUser')" id="tabCreate" class="px-5 py-2 rounded-lg text-xs font-bold transition cursor-pointer bg-slate-100 text-slate-600 hover:bg-slate-200">+ Add User</button>
                </div>

                <!-- ── STUDENTS PANEL ── -->
                <div id="panelStudents" class="space-y-4">
                    <h2 class="text-lg font-bold text-slate-800 tracking-tight">Student Directory</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" id="studentCardsContainer">
                        <p class="text-slate-400 text-sm col-span-3">Loading...</p>
                    </div>
                </div>

                <!-- ── FACULTY PANEL ── -->
                <div id="panelFaculty" class="hidden space-y-4">
                    <h2 class="text-lg font-bold text-slate-800 tracking-tight">Faculty Directory</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" id="facultyCardsContainer">
                        <p class="text-slate-400 text-sm col-span-3">Loading...</p>
                    </div>
                </div>

                <!-- ── PENDING DEVICES PANEL ── -->
                <div id="panelDevices" class="hidden space-y-4">
                    <h2 class="text-lg font-bold text-slate-800 tracking-tight">Pending Device Approvals</h2>
                    <p class="text-xs text-slate-500">These students scanned or logged in from a new device. Approve it so they can use the QR scanner.</p>
                    <div id="devicesContainer" class="space-y-3">
                        <p class="text-slate-400 text-sm">Loading...</p>
                    </div>
                </div>

                <!-- ── CREATE USER PANEL ── -->
                <div id="panelCreateUser" class="hidden space-y-4">
                    <h2 class="text-lg font-bold text-slate-800 tracking-tight">Add New User</h2>
                    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm max-w-lg space-y-4">

                        <div class="space-y-1">
                            <label class="text-[11px] font-bold text-slate-500 uppercase">Full Name</label>
                            <input type="text" id="newName" placeholder="e.g. Ravi Patel" class="w-full text-sm border border-slate-200 rounded-lg p-2.5 focus:outline-[#002060]">
                        </div>

                        <div class="space-y-1">
                            <label class="text-[11px] font-bold text-slate-500 uppercase">Email</label>
                            <input type="email" id="newEmail" placeholder="e.g. 3060824001@cait.edu.in" class="w-full text-sm border border-slate-200 rounded-lg p-2.5 focus:outline-[#002060]">
                            <p class="text-[10px] text-slate-400">For students: use enrollment@cait.edu.in format</p>
                        </div>

                        <div class="space-y-1">
                            <label class="text-[11px] font-bold text-slate-500 uppercase">Password</label>
                            <input type="password" id="newPassword" placeholder="Temporary password" class="w-full text-sm border border-slate-200 rounded-lg p-2.5 focus:outline-[#002060]">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div class="space-y-1">
                                <label class="text-[11px] font-bold text-slate-500 uppercase">Role</label>
                                <select id="newRole" class="w-full text-sm border border-slate-200 rounded-lg p-2.5 focus:outline-[#002060]">
                                    <option value="student">Student</option>
                                    <option value="faculty">Faculty</option>
                                    <option value="staff">Staff</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </div>
                            <div class="space-y-1">
                                <label class="text-[11px] font-bold text-slate-500 uppercase">Enrollment No.</label>
                                <input type="text" id="newEnrollment" placeholder="3060824001 (students only)" class="w-full text-sm font-mono border border-slate-200 rounded-lg p-2.5 focus:outline-[#002060]">
                            </div>
                        </div>

                        <div class="space-y-1">
                            <label class="text-[11px] font-bold text-slate-500 uppercase">Semester ID <span class="text-slate-300">(students only)</span></label>
                            <input type="number" id="newSemesterId" placeholder="e.g. 1" class="w-full text-sm border border-slate-200 rounded-lg p-2.5 focus:outline-[#002060]">
                        </div>

                        <div class="flex items-center gap-3 pt-2">
                            <button onclick="createUser()" class="bg-[#002060] hover:bg-[#001845] text-white text-xs font-bold px-6 py-2.5 rounded-lg transition cursor-pointer">
                                Create User
                            </button>
                            <span id="createUserStatus" class="text-xs font-bold"></span>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        // ─────────────────────────────────────────────
        // API HELPER
        // ─────────────────────────────────────────────
        async function apiCall(method, endpoint, body = null) {
            const token = sessionStorage.getItem('token');
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    ...(token && { 'Authorization': 'Bearer ' + token })
                }
            };
            if (body) options.body = JSON.stringify(body);
            const response = await fetch('http://10.112.74.68:5000' + endpoint, options);
            const data = await response.json();
            if (response.status === 401 || response.status === 403) {
                sessionStorage.clear();
                window.location.href = 'login.html';
                return;
            }
            return { ok: response.ok, data };
        }

        // ─────────────────────────────────────────────
        // SIDEBAR + NAV
        // ─────────────────────────────────────────────
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        menuBtn.addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.remove('hidden'); });
        overlay.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.classList.add('hidden'); });
        document.getElementById('profileBtn').addEventListener('click', () => window.location.href = 'login.html');
        document.getElementById('logoutBtn').addEventListener('click', () => { sessionStorage.clear(); window.location.href = 'login.html'; });

        // ─────────────────────────────────────────────
        // AUTH GUARD
        // ─────────────────────────────────────────────
        if (sessionStorage.getItem('flag') !== 'admin login') {
            window.location.href = 'login.html';
        }

        // ─────────────────────────────────────────────
        // TAB SWITCHER
        // ─────────────────────────────────────────────
        const tabs   = ['students','faculty','devices','createUser'];
        const tabIds = { students:'tabStudents', faculty:'tabFaculty', devices:'tabDevices', createUser:'tabCreate' };

        function switchTab(active) {
            tabs.forEach(t => {
                document.getElementById('panel' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('hidden', t !== active);
                const btn = document.getElementById(tabIds[t]);
                if (t === active) {
                    btn.className = 'px-5 py-2 rounded-lg text-xs font-bold transition cursor-pointer bg-[#002060] text-white';
                } else {
                    btn.className = 'px-5 py-2 rounded-lg text-xs font-bold transition cursor-pointer bg-slate-100 text-slate-600 hover:bg-slate-200';
                    // re-add badge to devices tab if needed
                    if (t === 'devices') btn.querySelector('#pendingBadge') && null;
                }
            });

            // Lazy-load data on tab switch
            if (active === 'students')    loadStudents();
            if (active === 'faculty')     loadFaculty();
            if (active === 'devices')     loadPendingDevices();
        }

        // ─────────────────────────────────────────────
        // LOAD STUDENTS
        // ─────────────────────────────────────────────
        async function loadStudents() {
            const container = document.getElementById('studentCardsContainer');
            container.innerHTML = '<p class="text-slate-400 text-sm col-span-3">Loading...</p>';
            const result = await apiCall('GET', '/api/admin/users?role=student');
            if (!result?.ok) { container.innerHTML = '<p class="text-rose-500 text-sm col-span-3">Failed to load.</p>'; return; }

            const users = result.data.users;
            if (!users.length) { container.innerHTML = '<p class="text-slate-400 text-sm col-span-3">No students found.</p>'; return; }

            container.innerHTML = users.map(u => `
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-xs flex flex-col justify-between">
                    <div>
                        <h3 class="font-bold text-base text-slate-800 leading-tight">${u.name}</h3>
                        <p class="text-xs font-mono font-bold text-slate-400 mt-1">${u.enrollment_no || '—'}</p>
                        <p class="text-xs text-slate-400 mt-0.5">${u.semester_name || 'No semester'}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${u.is_active ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-700 border border-red-200'}">
                            ${u.is_active ? 'Active' : 'Inactive'}
                        </span>
                        ${u.is_active ? `<button onclick="deactivateUser(${u.id}, this)" class="text-[10px] text-rose-600 font-bold hover:underline cursor-pointer">Deactivate</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // ─────────────────────────────────────────────
        // LOAD FACULTY
        // ─────────────────────────────────────────────
        async function loadFaculty() {
            const container = document.getElementById('facultyCardsContainer');
            container.innerHTML = '<p class="text-slate-400 text-sm col-span-3">Loading...</p>';
            const result = await apiCall('GET', '/api/admin/users?role=faculty');
            if (!result?.ok) { container.innerHTML = '<p class="text-rose-500 text-sm col-span-3">Failed to load.</p>'; return; }

            const users = result.data.users;
            if (!users.length) { container.innerHTML = '<p class="text-slate-400 text-sm col-span-3">No faculty found.</p>'; return; }

            container.innerHTML = users.map(u => `
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-xs flex flex-col justify-between">
                    <div>
                        <span class="text-[10px] font-mono font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded border border-slate-200">${u.email}</span>
                        <h3 class="font-bold text-base text-slate-800 mt-2.5 leading-tight">${u.name}</h3>
                    </div>
                    <div class="mt-4 pt-2 flex justify-between items-center">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${u.is_active ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-700 border border-red-200'}">
                            ${u.is_active ? 'Active' : 'Inactive'}
                        </span>
                        ${u.is_active ? `<button onclick="deactivateUser(${u.id}, this)" class="text-[10px] text-rose-600 font-bold hover:underline cursor-pointer">Deactivate</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // ─────────────────────────────────────────────
        // LOAD PENDING DEVICES — the key admin action
        // ─────────────────────────────────────────────
        async function loadPendingDevices() {
            const container = document.getElementById('devicesContainer');
            container.innerHTML = '<p class="text-slate-400 text-sm">Loading...</p>';
            const result = await apiCall('GET', '/api/devices/pending');
            if (!result?.ok) { container.innerHTML = '<p class="text-rose-500 text-sm">Failed to load.</p>'; return; }

            const devices = result.data.pendingDevices;

            // Update badge count
            const badge = document.getElementById('pendingBadge');
            if (devices.length > 0) {
                badge.textContent = devices.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            if (!devices.length) {
                container.innerHTML = `
                    <div class="bg-white border border-slate-200 rounded-xl p-8 text-center shadow-sm">
                        <p class="text-2xl mb-2">✅</p>
                        <p class="text-slate-600 font-bold">No pending device approvals</p>
                        <p class="text-xs text-slate-400 mt-1">All student devices are approved or none have been submitted yet.</p>
                    </div>`;
                return;
            }

            container.innerHTML = devices.map(d => `
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4" id="device-card-${d.id}">
                    <div>
                        <p class="font-bold text-slate-800 text-sm">${d.student_name}</p>
                        <p class="text-xs font-mono text-slate-500 mt-0.5">Enrollment: ${d.enrollment_no || '—'}</p>
                        <p class="text-[10px] text-slate-400 mt-1 font-mono break-all">Fingerprint: ${d.fingerprint_hash.substring(0, 20)}...</p>
                        <p class="text-[10px] text-slate-400 mt-0.5">Submitted: ${new Date(d.registered_at).toLocaleString()}</p>
                    </div>
                    <div class="flex gap-2 flex-shrink-0">
                        <button onclick="approveDevice(${d.id})"
                            class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition cursor-pointer">
                            ✓ Approve
                        </button>
                        <button onclick="rejectDevice(${d.id})"
                            class="bg-slate-100 hover:bg-slate-200 text-rose-600 text-xs font-bold px-4 py-2 rounded-lg transition cursor-pointer">
                            ✗ Reject
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ─────────────────────────────────────────────
        // APPROVE DEVICE
        // ─────────────────────────────────────────────
        async function approveDevice(deviceId) {
            const result = await apiCall('PATCH', `/api/devices/${deviceId}/approve`);
            if (result?.ok) {
                const card = document.getElementById(`device-card-${deviceId}`);
                if (card) {
                    card.innerHTML = `<p class="text-emerald-600 font-bold text-sm py-2">✓ Device approved — student can now scan QR.</p>`;
                    setTimeout(() => { card.remove(); loadPendingDevices(); }, 2000);
                }
            } else {
                alert(result?.data?.error || 'Approval failed.');
            }
        }

        // ─────────────────────────────────────────────
        // REJECT / DEACTIVATE DEVICE
        // ─────────────────────────────────────────────
        async function rejectDevice(deviceId) {
            if (!confirm('Remove this device request?')) return;
            const result = await apiCall('PATCH', `/api/devices/${deviceId}/deactivate`);
            if (result?.ok) {
                document.getElementById(`device-card-${deviceId}`)?.remove();
            } else {
                alert(result?.data?.error || 'Failed.');
            }
        }

        // ─────────────────────────────────────────────
        // DEACTIVATE USER
        // ─────────────────────────────────────────────
        async function deactivateUser(userId, btn) {
            if (!confirm('Deactivate this user? They will not be able to log in.')) return;
            btn.disabled = true;
            const result = await apiCall('DELETE', `/api/admin/users/${userId}`);
            if (result?.ok) {
                btn.textContent = 'Deactivated';
                btn.previousElementSibling.textContent = 'Inactive';
                btn.previousElementSibling.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-50 text-red-700 border border-red-200';
            } else {
                btn.disabled = false;
                alert(result?.data?.error || 'Failed to deactivate.');
            }
        }

        // ─────────────────────────────────────────────
        // CREATE USER
        // ─────────────────────────────────────────────
        async function createUser() {
            const statusEl = document.getElementById('createUserStatus');
            const payload = {
                name:          document.getElementById('newName').value.trim(),
                email:         document.getElementById('newEmail').value.trim(),
                password:      document.getElementById('newPassword').value,
                role:          document.getElementById('newRole').value,
                enrollment_no: document.getElementById('newEnrollment').value.trim() || undefined,
                semester_id:   parseInt(document.getElementById('newSemesterId').value) || undefined
            };

            if (!payload.name || !payload.email || !payload.password) {
                statusEl.textContent = 'Name, email, and password are required.';
                statusEl.style.color = '#dc2626';
                return;
            }

            statusEl.textContent = 'Creating...';
            statusEl.style.color = '#2563eb';

            const result = await apiCall('POST', '/api/auth/register', payload);

            if (result?.ok) {
                statusEl.textContent = '✓ User created! ID: ' + result.data.userId;
                statusEl.style.color = '#16a34a';
                // Clear form
                ['newName','newEmail','newPassword','newEnrollment','newSemesterId'].forEach(id =>
                    document.getElementById(id).value = ''
                );
            } else {
                statusEl.textContent = '✗ ' + (result?.data?.error || 'Failed.');
                statusEl.style.color = '#dc2626';
            }
        }

        // ─────────────────────────────────────────────
        // BOOT
        // ─────────────────────────────────────────────
        loadStudents();

        // Show pending device badge on load
        apiCall('GET', '/api/devices/pending').then(result => {
            if (result?.ok && result.data.pendingDevices.length > 0) {
                const badge = document.getElementById('pendingBadge');
                badge.textContent = result.data.pendingDevices.length;
                badge.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
